<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Cookie Consent</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">

<style>
html, body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:'Prompt',sans-serif;
}

/* ซ่อน scroll bar */
body{
  overflow:hidden;
}

/* cookie bar */
#cookieBox{
  position:fixed;
  bottom:0;
  left:0;
  width:100vw;
  box-sizing:border-box;

  background:rgba(31,41,55,0.95);
  color:#fff;

  padding:12px 16px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  font-size:14px;
  line-height:1.4;

  backdrop-filter: blur(6px);
}

/* ข้อความ */
#cookieBox span{
  flex:1;
}

/* ปุ่ม */
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  white-space:nowrap;
}

.accept{
  background:#22c55e;
  color:#fff;
}

.decline{
  background:#e5e7eb;
  color:#000;
}
</style>
</head>

<body>

<div id="cookieBox">
  <span>เว็บไซต์นี้ใช้คุกกี้เพื่อพัฒนาประสบการณ์ของคุณ</span>
  <div>
    <button class="accept" onclick="acceptCookie()">ยอมรับ</button>
    <button class="decline" onclick="declineCookie()">ปฏิเสธ</button>
  </div>
</div>

<script>
function acceptCookie(){
  localStorage.setItem("cookieConsent","true");
  document.getElementById("cookieBox").style.display="none";
}

function declineCookie(){
  localStorage.setItem("cookieConsent","false");
  document.getElementById("cookieBox").style.display="none";
}

/* ซ่อนถ้าเคยกดแล้ว */
if(localStorage.getItem("cookieConsent")){
  document.getElementById("cookieBox").style.display="none";
}
</script>

</body>
</html>
