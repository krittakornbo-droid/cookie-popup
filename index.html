<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cookie Consent</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">

<style>
html, body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:'Prompt',sans-serif;
  overflow:hidden;
}

/* COOKIE BAR */
#cookieBox{
  position:fixed;
  bottom:0;
  left:0;
  width:100vw;
  box-sizing:border-box;

  background:rgba(31,41,55,0.95);
  color:#fff;

  padding:12px 16px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  font-size:14px;
  line-height:1.4;

  backdrop-filter: blur(6px);
  animation: slideUp 0.4s ease;
}

/* TEXT */
#cookieBox span{
  flex:1;
}

/* LINK */
#cookieBox a{
  color:#4ade80;
  text-decoration:none;
}

/* BUTTON */
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  white-space:nowrap;
}

.accept{
  background:#22c55e;
  color:#fff;
}

.decline{
  background:#e5e7eb;
  color:#000;
}

/* ANIMATION */
@keyframes slideUp{
  from{ transform:translateY(100%); }
  to{ transform:translateY(0); }
}

/* MOBILE */
@media (max-width:600px){
  #cookieBox{
    flex-direction:column;
    align-items:flex-start;
  }

  button{
    width:100%;
    margin-top:5px;
  }
}
</style>
</head>

<body>

<div id="cookieBox">
  <span>
    เว็บไซต์นี้ใช้คุกกี้เพื่อพัฒนาประสบการณ์ของคุณ 
    <a href="https://your-site/privacy" target="_blank">
      อ่านนโยบายความเป็นส่วนตัว
    </a>
  </span>

  <div>
    <button class="accept" onclick="acceptCookie()">ยอมรับ</button>
    <button class="decline" onclick="declineCookie()">ปฏิเสธ</button>
  </div>
</div>

<script>
function acceptCookie(){
  localStorage.setItem("cookieConsent","true");
  hideBar();
}

function declineCookie(){
  localStorage.setItem("cookieConsent","false");
  hideBar();
}

function hideBar(){
  document.getElementById("cookieBox").style.display="none";
}

/* CHECK STATUS */
window.onload = function(){
  if(localStorage.getItem("cookieConsent")){
    hideBar();
  }
};
</script>

</body>
</html>
